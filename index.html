<style>
/* Layout: portrait phone app — top bar with coins; views swap below: home (your ball + upgrade + map), fight (cards + square arena + thumb controls), shop (rarity tabs + 2-col grid) */
:root{
  --night:#0b1424;
  --neon:#56f0ff;
  --gold:#ffc83d;
  --win:#7dff8a;
  --dmg:#ff2b3a;
  --ink:#eaf6ff;
  --muted:#8aa3c4;
  --panel:#16233a;
  --panel2:#1d2e4b;
  --common:#a9b8cc;
  --rare:#4fa8ff;
  --epic:#c06bff;
  --legend:#ffb02e;
  --glowA:#1d3c70;
  --glowB:#2c1656;
  --display:"Lilita One","Arial Black",system-ui,sans-serif;
  --body:"Rubik",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{font-size:14px}
img{max-width:100%}
body{background:var(--night);color:var(--ink);font-family:var(--body);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.app{height:100%;display:flex;flex-direction:column;gap:10px;
  padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  box-sizing:border-box;max-width:560px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.title{font-family:var(--display);font-size:clamp(18px,5.4vw,26px);margin:0;letter-spacing:.3px;text-shadow:0 3px 0 #000a;line-height:1.05;min-width:0;text-wrap:balance;font-weight:400}
.title .vs{color:var(--muted);font-size:.7em;padding:0 .25em}
.coins{font-family:var(--display);font-size:20px;color:var(--gold);background:var(--panel);border-radius:999px;padding:6px 14px 6px 8px;
  display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums;flex-shrink:0;transition:transform .15s}
.coins.bump{transform:scale(1.18)}
.coin{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b0,var(--gold) 55%,#b8860b);box-shadow:inset 0 -2px 0 #0004;display:inline-block;flex-shrink:0}
.view{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.chip{font-size:10px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:#0006;display:inline-block}
.r-common{color:var(--common)} .r-rare{color:var(--rare)} .r-epic{color:var(--epic)} .r-legend{color:var(--legend)}

/* home */
.home{align-items:center;gap:9px;overflow-y:auto;text-align:center}
.home>*{flex-shrink:0}
.home .spacer{flex:1;min-height:0}
.home h2{font-family:var(--display);font-size:clamp(30px,9vw,46px);margin:0;line-height:1;font-weight:400}
.home p{margin:0;color:var(--muted);max-width:34ch;line-height:1.4;font-size:14px}
.stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.stat{background:var(--panel);border-radius:10px;padding:6px 10px;font-size:12px;color:var(--muted);font-weight:700}
.stat b{color:var(--ink);font-family:var(--display);font-weight:400;font-size:15px;margin-left:4px}
.lvl{display:flex;gap:4px}
.lvl i{width:18px;height:6px;border-radius:3px;background:var(--panel2)}
.lvl i.on{background:var(--gold)}
.home .btns{display:grid;gap:10px;width:min(100%,360px)}
.home .btns .two{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.home .btns .two button{font-size:16px;padding:12px 6px}
.owned{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:360px}
.owned button{width:40px;height:40px;padding:0;border-radius:50%;background:var(--panel);box-shadow:none;border:3px solid transparent}
.owned button.on{border-color:var(--neon)}
.owned canvas{width:100%;height:100%;display:block;border-radius:50%}
.record{font-family:var(--display);font-size:15px;display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.record b{color:var(--win);font-weight:400} .record i{font-style:normal;color:var(--dmg)} .record u{text-decoration:none;color:var(--gold)}
.mapbtn{width:100%;background:var(--panel);color:var(--ink);box-shadow:none;justify-content:space-between;padding:10px 14px;font-size:16px}
.mapbtn small{font-family:var(--body);font-size:12px;color:var(--muted);font-weight:700}

/* fight */
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--panel);border-radius:14px;padding:9px 12px;display:flex;flex-direction:column;gap:5px;min-width:0}
.card .who{font-size:10px;letter-spacing:1.6px;font-weight:700;color:var(--muted);text-transform:uppercase;display:flex;justify-content:space-between}
.card .who span{color:var(--gold)}
.card .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.card .name{font-family:var(--display);font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .hp{font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:6px;background:#0007;overflow:hidden;position:relative}
.bar i{position:absolute;inset:0;transform-origin:left;transition:transform .15s}
.bar b{position:absolute;inset:0;transform-origin:left;background:#fff6;transition:transform .7s .25s}
.card .skill{font-size:11px;color:var(--muted);line-height:1.3}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;touch-action:none}
#netLag{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:#000d;color:#ffd23d;padding:7px 14px;border-radius:999px;font-weight:700;font-size:13px;z-index:6;pointer-events:none;white-space:nowrap;box-shadow:0 0 0 2px #ffd23d55}
#cv{display:block;border-radius:10px;box-shadow:0 0 0 3px #2b4a75,0 18px 40px #0009}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;pointer-events:none;padding:16px}
.overlay .big{font-family:var(--display);font-size:clamp(34px,11vw,56px);line-height:1;text-shadow:0 4px 0 #000,0 0 30px #000}
.overlay .small{font-size:15px;color:var(--ink);text-shadow:0 2px 4px #000;font-weight:700;line-height:1.4}
.overlay .tag{font-family:var(--display);font-size:16px;background:#000a;padding:6px 14px;border-radius:999px;line-height:1.2}
.overlay .tag small{display:block;font-family:var(--body);font-size:12px;color:var(--muted);font-weight:700}
.overlay .reward{display:grid;gap:4px;background:#000b;border-radius:14px;padding:10px 16px;min-width:200px}
.overlay .reward div{display:flex;justify-content:space-between;gap:16px;font-weight:700;font-size:14px}
.overlay .reward div b{font-family:var(--display);font-weight:400;color:var(--gold);font-size:18px}
.overlay .reward .tot{border-top:1px solid #fff3;padding-top:6px;font-size:16px}
.overlay .row{display:flex;gap:10px;pointer-events:auto}
.controls{display:grid;grid-template-columns:1.6fr 1fr .75fr .75fr;gap:8px;padding-bottom:4px}
.controls button{padding:14px 6px}
button.super{background:linear-gradient(90deg,var(--gold) calc(var(--p,0) * 100%),var(--panel2) 0);color:var(--ink);font-size:16px;text-shadow:0 2px 0 #0008}
button.super.ready{background:var(--gold);color:var(--night);text-shadow:none;animation:pulse .5s infinite alternate}
button.super:disabled{cursor:default}
@keyframes pulse{to{transform:scale(1.05);box-shadow:0 0 26px var(--gold)}}
.sbar{height:4px;border-radius:2px;background:#0006;overflow:hidden}
.sbar i{display:block;height:100%;background:var(--gold);transform-origin:left;transform:scaleX(0)}
button.tour{background:var(--epic);color:#fff}
button.online{background:var(--panel);color:var(--neon);box-shadow:inset 0 0 0 2px var(--neon);width:100%;font-size:17px;padding:11px}
.pickfoe{display:flex;align-items:center;gap:12px;background:#000b;border-radius:14px;padding:6px 14px 6px 6px;text-align:left}
.pickfoe canvas{width:52px;height:52px}
.pickfoe small{display:block;font-size:11px;color:var(--muted);font-weight:700;letter-spacing:1px;text-transform:uppercase}
.pickfoe b{font-family:var(--display);font-weight:400;font-size:18px}
.pickrow{display:flex;gap:8px;pointer-events:auto}
.pickbtn{flex-direction:column;gap:2px;width:88px;padding:8px 4px;background:var(--panel);color:var(--ink);font-size:14px;box-shadow:0 4px 0 #0008,inset 0 0 0 2px var(--neon)}
.pickbtn canvas{width:52px;height:52px}
.pickbtn small{font-family:var(--body);font-size:11px;color:var(--muted);font-weight:700}
.pickbtn:disabled{opacity:.35;box-shadow:none}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{background:var(--panel2);border-radius:14px;height:92px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:var(--display);font-size:14px;color:var(--muted);border:2px dashed #ffffff22}
.slot.on{border:2px solid var(--neon);color:var(--ink)}
.slot canvas{width:56px;height:56px}
.grid.tgrid{grid-template-columns:repeat(4,1fr);gap:8px}
.tpick{flex-direction:column;gap:2px;padding:8px 2px;background:var(--panel);color:var(--ink);font-size:13px;box-shadow:none;position:relative;min-width:0}
.tpick.on{box-shadow:inset 0 0 0 3px var(--neon)}
.tpick canvas{width:48px;height:48px}
.tpick span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tpick small{font-family:var(--body);font-size:10px;color:var(--muted);font-weight:700}
.tpick i{position:absolute;top:4px;right:6px;font-style:normal;background:var(--neon);color:var(--night);border-radius:50%;width:20px;height:20px;line-height:20px;font-size:12px}
#bTeamGo:disabled{background:var(--panel2);color:var(--muted);box-shadow:none}
.cupi{width:1em;height:1em;vertical-align:-.12em;color:var(--gold)}
.arenaban{width:min(100%,360px);display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;text-align:left;padding:10px 14px;border-radius:16px;
  background:linear-gradient(120deg,var(--ac,#4fa8ff) -40%,var(--panel) 55%);color:var(--ink);box-shadow:0 4px 0 #0008,inset 0 0 0 2px var(--ac,#4fa8ff)}
.arenaban .arl small{display:block;font-family:var(--body);font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:#ffffffcc}
.arenaban .arl b{font-family:var(--display);font-weight:400;font-size:20px}
.arenaban .troph{font-family:var(--display);font-size:26px;color:var(--gold);display:flex;align-items:center;gap:4px}
.arenaban .arbar{grid-column:1/-1;height:8px;border-radius:4px;background:#0007;overflow:hidden;display:block}
.arenaban .arbar i{display:block;height:100%;background:var(--gold);transform-origin:left}
.arenaban .arnext{grid-column:1/-1;font-family:var(--body);font-size:11px;font-weight:700;color:#ffffffaa}
button.battle{flex-direction:column;gap:0;line-height:1.05;background:var(--gold)}
button.battle small{font-family:var(--body);font-size:12px;font-weight:700;opacity:.75}
.cupdelta{font-family:var(--display);font-size:30px;text-shadow:0 3px 0 #000;display:flex;align-items:baseline;gap:8px}
.cupdelta.up{color:var(--gold)} .cupdelta.down{color:#ff6b6b}
.cupdelta small{font-family:var(--body);font-size:13px;color:var(--ink);font-weight:700}
.road{background:var(--panel);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;box-shadow:inset 4px 0 0 var(--ac)}
.road.cur{box-shadow:inset 0 0 0 2px var(--ac)}
.road.lock{opacity:.55}
.road .rhead{display:flex;align-items:baseline;gap:8px}
.road .rnum{font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--ac)}
.road b{font-family:var(--display);font-weight:400;font-size:18px;flex:1;min-width:0}
.road .rmin{font-family:var(--display);color:var(--gold);font-size:16px}
.road small{font-size:12px;color:var(--muted);font-weight:700}
.rballs{display:flex;gap:4px;flex-wrap:wrap}
.topr{display:flex;align-items:center;gap:8px;flex-shrink:0}
button.coins{border:0;box-shadow:none;cursor:pointer}
.coins .plus{width:20px;height:20px;border-radius:50%;background:var(--win);color:var(--night);font-size:16px;line-height:20px;text-align:center;margin-left:2px}
.gear{width:40px;height:40px;padding:0;border-radius:50%;background:var(--panel);color:var(--ink);box-shadow:none}
.gear svg{width:22px;height:22px}
.modal{position:fixed;inset:0;z-index:30;background:#000b;display:flex;align-items:center;justify-content:center;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.mbox{background:var(--panel);border-radius:20px;padding:20px;width:min(100%,380px);max-height:100%;overflow-y:auto;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 50px #000a,inset 0 0 0 2px #ffffff14}
.mbox h3{font-family:var(--display);font-weight:400;font-size:26px;margin:0;line-height:1.1}
.mbox p{margin:0;color:#c3d3ea;line-height:1.45;font-size:15px}
.mrow{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.mrow button{flex:1}
.mlabel{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:1px;text-transform:uppercase}
.minput{font:700 17px var(--body);color:var(--ink);background:var(--night);border:2px solid var(--panel2);border-radius:12px;padding:12px;width:100%;-webkit-user-select:text;user-select:text}
.minput:focus{outline:none;border-color:var(--neon)}
.tstep{display:flex;gap:6px}
.tstep i{flex:1;height:5px;border-radius:3px;background:var(--panel2)}
.tstep i.on{background:var(--neon)}
.news{margin:0;padding-left:20px;color:#c3d3ea;line-height:1.5;display:grid;gap:6px}
.tog{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.langsw{display:flex;gap:4px;background:var(--night);border-radius:999px;padding:3px}
.langsw button{padding:6px 12px;font-size:14px;border-radius:999px;background:transparent;color:var(--muted);box-shadow:none}
.langsw button.on{background:var(--neon);color:var(--night)}
.tog button{width:54px;height:30px;padding:3px;border-radius:999px;background:var(--panel2);box-shadow:none;justify-content:flex-start}
.tog button i{width:24px;height:24px;border-radius:50%;background:var(--muted);display:block;transition:transform .15s}
.tog button.on{background:var(--neon)}
.tog button.on i{background:#fff;transform:translateX(24px)}
.mver{font-size:12px!important;color:var(--muted)!important;text-align:center}
.chestm{align-items:center;text-align:center}
.chest{position:relative;width:150px;height:130px;margin:44px auto 0;cursor:pointer}
.chest .cbody{position:absolute;left:0;right:0;bottom:0;height:80px;border-radius:10px;background:linear-gradient(var(--c1),var(--c2));box-shadow:inset 0 -6px 0 #0004,0 8px 0 #0006}
.chest .clid{position:absolute;left:-6px;right:-6px;top:6px;height:52px;border-radius:30px 30px 8px 8px;background:linear-gradient(var(--c1),var(--c2));box-shadow:inset 0 -5px 0 #0003;transform-origin:20% 100%;transition:transform .35s cubic-bezier(.3,1.6,.5,1);z-index:2}
.chest .clock{position:absolute;left:50%;top:-6px;width:28px;height:30px;margin-left:-14px;border-radius:6px;background:#ffe9a8;box-shadow:inset 0 -4px 0 #b8860b}
.chest.shake{animation:cshake .12s infinite}
.chest.open .clid{transform:translateY(-34px) rotate(-28deg)}
.chest.open::after{content:"";position:absolute;inset:-30px;background:radial-gradient(circle,#fff8 0,transparent 60%);z-index:1;pointer-events:none}
@keyframes cshake{0%,100%{transform:rotate(0)}25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
.ctap{font-weight:700}
.cres{display:grid;gap:8px}
.crow{display:flex;align-items:center;justify-content:center;gap:10px;font-size:18px}
.crow b{font-family:var(--display);font-weight:400;font-size:24px;color:var(--gold)}

/* ===== v1.1 menu & interface ===== */
body{background:radial-gradient(900px 520px at 50% -12%,var(--glowA) 0%,transparent 62%),radial-gradient(700px 520px at 110% 105%,var(--glowB) 0%,transparent 60%),var(--night)}
.app{gap:8px}
.top{min-height:44px}
.pchip{display:flex;align-items:center;gap:8px;min-width:0;background:#0007;border-radius:999px;padding:3px 14px 3px 3px;box-shadow:inset 0 0 0 1px #ffffff14}
.pchip canvas{width:36px;height:36px;border-radius:50%;background:var(--panel2)}
.pchip b{display:block;font-family:var(--display);font-weight:400;font-size:16px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
.pchip small{display:block;font-family:var(--display);font-size:13px;color:var(--gold);line-height:1.1}
.home{justify-content:flex-start;gap:10px;padding-bottom:6px}
.home .arenaban{width:100%;max-width:none;padding:12px 16px;position:relative;overflow:hidden}
.home .arenaban::before{content:"";position:absolute;right:-30px;top:-40px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,var(--ac) 0,transparent 65%);opacity:.35}
.home .arenaban .arl b{font-size:22px}
.hero{display:grid;grid-template-columns:132px 1fr;gap:12px;align-items:center;width:100%;background:linear-gradient(160deg,#ffffff0d,#ffffff03);border-radius:20px;padding:10px 12px 12px;box-shadow:inset 0 0 0 1px #ffffff12}
.pedestal{position:relative;width:132px;height:150px;cursor:pointer}
.pedestal .halo{position:absolute;left:50%;top:44%;width:130px;height:130px;margin:-65px 0 0 -65px;border-radius:50%;background:radial-gradient(circle,var(--bc,#56f0ff) 0,transparent 68%);opacity:.45;animation:halo 3s ease-in-out infinite}
.pedestal canvas{position:absolute;left:50%;top:44%;width:128px;height:128px;margin:-64px 0 0 -64px;animation:bob 3s ease-in-out infinite}
.pedestal .plat{position:absolute;left:14px;right:14px;bottom:2px;height:22px;border-radius:50%;background:radial-gradient(ellipse at 50% 30%,#3a5a8c,#13223c);box-shadow:0 4px 0 #0008,inset 0 2px 0 #ffffff22}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes halo{0%,100%{transform:scale(.92);opacity:.35}50%{transform:scale(1.06);opacity:.55}}
.herocard{display:flex;flex-direction:column;gap:5px;text-align:left;min-width:0}
.herocard h2{font-size:28px!important;line-height:1}
.herocard p{font-size:12px!important;line-height:1.35!important;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:none!important}
.herocard .stats{justify-content:flex-start;gap:5px}
.herocard .stat{padding:4px 8px;font-size:11px}
.herocard .stat b{font-size:13px}
.herocard .upbtn{font-size:15px;padding:9px 10px;margin-top:2px}
.home .owned{max-width:none;gap:7px}
.home .owned button{width:44px;height:44px}
.home button.battle{width:100%;padding:12px 10px 14px;border-radius:20px;position:relative;overflow:hidden;
  background:linear-gradient(180deg,#ffe27a 0%,var(--gold) 45%,#f59e1b 100%);box-shadow:0 6px 0 #a5620b,0 12px 24px #0007,inset 0 2px 0 #fff8;color:#3b1d00}
.home button.battle .bt{font-family:var(--display);font-size:38px;line-height:1;letter-spacing:1px;text-shadow:0 2px 0 #fff6}

button{font-family:var(--display);font-size:18px;color:var(--night);border:0;border-radius:14px;padding:14px 10px;cursor:pointer;

function circleBounce(b,p){
  const dx=b.x-p.x,dy=b.y-p.y,d=Math.hypot(dx,dy),m=b.r+p.r;
  if(d<m&&d>0){const nx=dx/d,ny=dy/d;b.x=p.x+nx*m;b.y=p.y+ny*m;const v=b.vx*nx+b.vy*ny;if(v<0){b.vx-=2*v*nx;b.vy-=2*v*ny}b.squash=.15;return true}
  return false;

  if(b.x>hi-b.r){b.x=hi-b.r;b.vx=-Math.abs(b.vx);hit=true}
  if(b.y<lo+b.r){b.y=lo+b.r;b.vy=Math.abs(b.vy);hit=true}
  if(b.y>hi-b.r){b.y=hi-b.r;b.vy=-Math.abs(b.vy);hit=true}
  if(hit&&TYPES[b.type].onWall)TYPES[b.type].onWall(b);
  if(hit)wallFx(b,b.x<=lo+b.r+.5?1:b.x>=hi-b.r-.5?-1:0,b.y<=lo+b.r+.5?1:b.y>=hi-b.r-.5?-1:0);
  if(hit){b.squash=.12;if(arena.lava&&b.wallCd<=0&&playing()){b.wallCd=.4;damage(b,2,b.x,b.y,true);for(let i=0;i<5;i++)spark(b.x,b.y,'#ff6a2a')}}
  for(const p of arena.pillars||[])circleBounce(b,p);
  for(const p of arena.bumpers||[])if(circleBounce(b,p)){b.boostT=.45;p.hitT=.18;beep(880,.07,'square',.05,1.4);ring(p.x,p.y,'#ff4df2')}

function step(dt){
  time+=dt;
  for(const p of arena.bumpers||[])p.hitT=Math.max(0,(p.hitT||0)-dt);
  for(const b of balls){
    if(b.dead) continue;
    b.flash=Math.max(0,b.flash-dt);b.squash=Math.max(0,b.squash-dt);b.hitCd=Math.max(0,b.hitCd-dt);
    b.slowT=Math.max(0,b.slowT-dt);b.burnCd=Math.max(0,b.burnCd-dt);b.wallCd=Math.max(0,b.wallCd-dt);
    b.boostT=Math.max(0,b.boostT-dt);b.tpCd=Math.max(0,b.tpCd-dt);
    const T=TYPES[b.type];
    b.stunT=Math.max(0,(b.stunT||0)-dt);
    if(!b.hooked&&!b.latch&&!(b.stunT>0)){
      const sp=T.speed*b.mul*(b.slowT>0?.6:1)*(arena.speedMul||1)*(b.dashT>0?2.8:1)*(b.boostT>0?1.8:1)*(b.supT>0?3:1)*(b.boss?.85:1), cur=Math.hypot(b.vx,b.vy)||1;

    if(b.extra){const X=TYPES[b.extra];if(X.update){const s=b.t1;b.t1=b.t2;X.update(b,dt*.5);b.t2=b.t1;b.t1=s}}

    b.tx=N(0);b.ty=N(1);b.vx=N(2);b.vy=N(3);b.hp=N(4);b.max=N(5)||b.max;b.r=N(6)||b.r;b.sp=N(7)/100;b.shield=N(8)/10;
    if(N(9)&&!(b.supT>0))b.supT=.35;b.slowT=N(10)?.2:0;b.stunT=N(11)?.2:0;b.ghost=N(12)?.2:0;b.dashT=N(13)?.2:0;b.hooked=!!N(14);
    if(Math.hypot(b.tx-b.x,b.ty-b.y)>160){b.x=b.tx;b.y=b.ty}}
  if(Array.isArray(st.ev))for(const e of st.ev){if(!Array.isArray(e)||net.seen.has(e[0]))continue;net.seen.add(e[0]);
    const n=Math.floor(+e[3])||0,k=+e[4];

    if(k!==2){shake=Math.min(18,shake+(n>=5?10:3));beep(n>=5?140:280,n>=5?.14:.06,'square',.05,.5)}}
}
function netSmooth(){
  if(!net||net.role!=='guest')return;
  for(const b of balls)if(b.tx!=null&&!b.dead){b.x+=(b.tx-b.x)*.35;b.y+=(b.ty-b.y)*.35}
}

function rollChest(force){
  let r=Math.random()*100;let C=CHESTS[0];for(const c of CHESTS){if(r<c.w){C=c;break}r-=c.w}
  if(force)C=CHESTS.find(c=>c.id===force)||C;
  const coins=Math.round(rnd(C.coins[0],C.coins[1]));let ball=null,extra=0;
  if(Math.random()<C.ball){const pool=ORDER.filter(k=>!save.owned.includes(k)&&ballArena(k)<=arenaIdx(save.trophies||0));
    if(pool.length)ball=pool[Math.floor(Math.random()*pool.length)];else extra=60}
  save.coins+=coins+extra;if(ball){save.owned.push(ball)}
  save.chests=(save.chests||0)+1;persist();
  return {C,coins:coins+extra,ball};
}

/* ---------- animated menu background ---------- */
const BG={cv:null,g:null,w:0,h:0,blobs:[],floaters:[],sparks:[],last:0,reduce:false};
function bgInit(){
  const c=document.createElement('canvas');c.id='bgfx';c.setAttribute('aria-hidden','true');document.body.prepend(c);
  BG.cv=c;BG.g=c.getContext('2d');
  try{BG.reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){}
  const pal=['#ff4df2','#56f0ff','#ffc83d','#7dff8a','#8c5cff','#ff7a2f'];
  for(let i=0;i<6;i++)BG.blobs.push({x:Math.random(),y:Math.random(),r:.35+Math.random()*.35,sp:.05+Math.random()*.08,ph:Math.random()*6,c:pal[i%pal.length]});
  const kinds=Object.keys(TYPES);
  for(let i=0;i<9;i++)BG.floaters.push({k:kinds[Math.floor(Math.random()*kinds.length)],x:Math.random(),y:Math.random(),s:.22+Math.random()*.22,v:.015+Math.random()*.025,rot:Math.random()*6,vr:(Math.random()-.5)*.6});
  for(let i=0;i<40;i++)BG.sparks.push({x:Math.random(),y:Math.random(),p:Math.random()*6,s:1+Math.random()*2.2});
  bgResize();window.addEventListener('resize',bgResize);
}
function bgResize(){if(!BG.cv)return;BG.w=BG.cv.width=Math.ceil(innerWidth*Math.min(1.5,devicePixelRatio||1));BG.h=BG.cv.height=Math.ceil(innerHeight*Math.min(1.5,devicePixelRatio||1));BG.drawn=false}
function bgDraw(dt,t){
  if(!BG.cv)return;
  if(BG.reduce&&BG.drawn)return;
  BG.last+=dt;if(BG.last<1/30&&BG.drawn)return;BG.last=0;BG.drawn=true;
  const g=BG.g,W2=BG.w,H2=BG.h,ac=LADDER[arenaIdx(save.trophies||0)].color;
  g.globalCompositeOperation='source-over';
  const base=g.createLinearGradient(0,0,0,H2);base.addColorStop(0,'#0f1d3d');base.addColorStop(.55,'#0b1424');base.addColorStop(1,'#1a0f33');
  g.fillStyle=base;g.fillRect(0,0,W2,H2);
  g.globalCompositeOperation='lighter';
  BG.blobs.forEach((b,i)=>{const x=(b.x+Math.sin(t*b.sp+b.ph)*.18)*W2,y=(b.y+Math.cos(t*b.sp*.8+b.ph)*.14)*H2,r=b.r*Math.max(W2,H2)*.6;
    const gr=g.createRadialGradient(x,y,0,x,y,r);const col=i===0?ac:b.c;gr.addColorStop(0,col+'70');gr.addColorStop(.5,col+'26');gr.addColorStop(1,col+'00');g.fillStyle=gr;g.fillRect(0,0,W2,H2)});
  g.globalCompositeOperation='source-over';
  for(const sp of BG.sparks){const a=.25+.75*Math.abs(Math.sin(t*1.5+sp.p));g.globalAlpha=a*.7;g.fillStyle='#ffffff';g.beginPath();g.arc(sp.x*W2,sp.y*H2,sp.s,0,Math.PI*2);g.fill()}
  g.globalAlpha=1;
  const o=ctx;ctx=g;const unit=Math.min(W2,H2)/360;
  for(const f of BG.floaters){
    if(!BG.reduce){f.y-=f.v*dt;f.rot+=f.vr*dt;if(f.y<-.12){f.y=1.12;f.x=Math.random()}}
    g.save();g.globalAlpha=.28;g.translate(f.x*W2,f.y*H2);g.rotate(f.rot);const sc=f.s*unit*.5;g.scale(sc,sc);
    drawBall({type:f.k,x:0,y:0,r:62,hp:100,max:100,flash:0,squash:0,slowT:0,ang:0,hooked:false,dead:false,ghost:0,dashT:0,boostT:0,psn:[],trail:[],skin:'base'},false);
    g.restore()}
  ctx=o;
  const sh=g.createLinearGradient(0,0,0,H2);sh.addColorStop(0,'#0b142400');sh.addColorStop(1,'#0b142488');g.fillStyle=sh;g.fillRect(0,0,W2,H2);
}

function w(x){const t=(x||'').trim();return EN[t]!==undefined?EN[t]:t}
function tr(t){
  if(LANG!=='en'||typeof t!=='string')return t;
  const k=t.trim();if(!k||!/[A-Za-zÁÉÍÓÚáéíóúñÑ¿¡]/.test(k))return t;
  let r=EN[k];
  if(r===undefined){for(const [re,rep] of ENP){if(!rep)continue;if(re.test(k)){r=k.replace(re,rep);break}}}
  if(r===undefined||r===k)return t;
  return t.replace(k,r);
}
function trTree(root){
  if(LANG!=='en'||!root)return;
  if(root.nodeType===3){const v=root.nodeValue,r=tr(v);if(r!==v)root.nodeValue=r;return}
  if(root.nodeType!==1)return;
  if(root.tagName==='SCRIPT'||root.tagName==='STYLE')return;
  for(const a of['placeholder','aria-label','title'])if(root.hasAttribute&&root.hasAttribute(a)){const v=root.getAttribute(a),r=tr(v);if(r!==v)root.setAttribute(a,r)}
  const it=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while((n=it.nextNode())){const v=n.nodeValue,r=tr(v);if(r!==v)n.nodeValue=r}
  root.querySelectorAll&&root.querySelectorAll('[placeholder],[aria-label],[title]').forEach(e=>{for(const a of['placeholder','aria-label','title'])if(e.hasAttribute(a)){const v=e.getAttribute(a),r=tr(v);if(r!==v)e.setAttribute(a,r)}});
}
function i18nInit(){
  document.documentElement.lang=LANG;
  if(LANG!=='en')return;
  trTree(document.body);
  new MutationObserver(ms=>{for(const m of ms){if(m.type==='characterData')trTree(m.target);else m.addedNodes.forEach(trTree)}}).observe(document.body,{subtree:true,childList:true,characterData:true});
}

const today=()=>new Date().toISOString().slice(0,10);
function ensureMissions(){
  if(save.missions&&save.missions.day===today()&&Array.isArray(save.missions.list))return;
  const idx=[...MISSION_TPL.keys()].sort(()=>Math.random()-.5).slice(0,3);
  save.missions={day:today(),list:idx.map(i=>Object.assign({prog:0,claimed:false},MISSION_TPL[i]()))};persist();
}
function missionEvent(type,n,param){
  ensureMissions();
  for(const m of save.missions.list){if(m.type!==type||m.claimed)continue;if(m.param&&m.param!==param)continue;m.prog=Math.min(m.goal,m.prog+n)}
}
function claimable(){ensureMissions();return save.missions.list.filter(m=>m.prog>=m.goal&&!m.claimed).length}
function renderMissions(){
  ensureMissions();const L=$('misList');L.innerHTML='';
  for(const m of save.missions.list){
    const d=document.createElement('div');d.className='mis'+(m.claimed?' done':'');
    const t=document.createElement('div');const b=document.createElement('b');b.textContent=m.text;const sm=document.createElement('small');
    sm.textContent=`${m.prog} / ${m.goal}`;t.append(b,sm);d.appendChild(t);
    const bt=document.createElement('button');
    if(m.claimed){bt.className='done';bt.textContent='Hecha'}
    else if(m.prog>=m.goal){bt.className='gold';bt.innerHTML=`Reclamar <span class="coin"></span>${m.reward}`;
      bt.onclick=()=>{initAudio();m.claimed=true;save.coins+=m.reward;persist();setCoins(true);toast('+'+m.reward+' monedas');beep(784,.1,'square',.06);setTimeout(()=>beep(1046,.18,'square',.06),90);renderMissions()}}
    else{bt.className='lock';bt.innerHTML=`<span class="coin"></span>${m.reward}`}
    d.appendChild(bt);
    const pb=document.createElement('div');pb.className='pb';pb.innerHTML=`<i style="transform:scaleX(${m.prog/m.goal})"></i>`;d.appendChild(pb);

  }
}

let DB=null, USER=null, myId=null, players=[], canWrite=null, onlineState='loading', onTab='rank', writing=false, pendingPush=false, lastPushed='';
const cleanNick=v=>String(v||'').replace(/[\u0000-\u001f]/g,'').trim().slice(0,16);
function safePlayer(id,d){
  const n=x=>Number.isFinite(+x)?Math.max(0,Math.floor(+x)):0;
  const ball=TYPES[d.ball]?d.ball:'harpoon';
  let def=null;
  if(d.def&&typeof d.def==='object'){
    const map=ARENAS[d.def.map]?d.def.map:'clasica';
    let team=Array.isArray(d.def.team)?d.def.team.filter(t=>t&&TYPES[t.ball]).slice(0,3).map(t=>({ball:t.ball,lv:clamp(n(t.lv)||1,1,MAXLV)})):[];
    if(!team.length&&TYPES[d.def.ball])team=[{ball:d.def.ball,lv:clamp(n(d.def.lv)||1,1,MAXLV)}];
    while(team.length&&team.length<3)team.push(team[team.length-1]);
    if(team.length===3)def={team,map};
  }
  return {id,nick:cleanNick(d.nick),trophies:n(d.trophies),wins:n(d.wins),losses:n(d.losses),tours:n(d.tours),best:n(d.best),retos:n(d.retos),ball,lv:clamp(n(d.lv)||1,1,MAXLV),def};
}
async function initOnline(){
  try{if(window.claude&&typeof window.claude.use==='function')window.claude.use('room').then(r=>{ROOM=r||null}).catch(()=>{ROOM=null})}catch(e){}
  try{
    if(!window.claude||typeof window.claude.use!=='function'){onlineState='off';renderOnline();return}
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user){onlineState='off';renderOnline();return}
    DB=db;USER=user;myId=await user.id();
    if(!myId){onlineState='off';renderOnline();return}
    canWrite=await user.can('data.write');
    onlineState='on';
    if(!save.nick){const me=await user.me();save.nick=cleanNick((me.name||'').split(' ')[0]);persist()}
    db.collection('players').onSnapshot(snap=>{players=snap.docs.filter(d=>d.exists).map(d=>safePlayer(d.id,d.data()||{}));renderOnline()},
      ()=>{onlineState='off';renderOnline()});
    pushOnline();renderOnline();
  }catch(e){onlineState='off';renderOnline()}
}
function myDoc(){return {nick:cleanNick(save.nick),trophies:save.trophies||0,wins:save.wins,losses:save.losses,tours:save.tours||0,best:save.best||0,retos:save.retos||0,
  ball:save.sel,lv:lvOf(save.sel),def:save.def||null}}
async function pushOnline(){
  if(!DB||!myId||canWrite===false)return;
  const doc=myDoc(),key=JSON.stringify(doc);
  if(key===lastPushed)return;
  if(writing){pendingPush=true;return}
  writing=true;
  try{await DB.doc('players/'+myId).set(Object.assign({upd:Date.now()},doc));lastPushed=key}
  catch(e){if(e&&e.code==='invalid_argument'){canWrite=false;renderOnline()}}
  writing=false;
  if(pendingPush){pendingPush=false;pushOnline()}
}
async function displayNames(list){
  const out={};const need=[];
  for(const p of list){if(p.nick)out[p.id]=p.nick;else need.push(p.id)}
  if(need.length&&USER){try{const ps=await USER.profiles(need);for(const id of need)out[id]=(ps[id]&&ps[id].name)||'Jugador'}catch(e){for(const id of need)out[id]='Jugador'}}
  else for(const id of need)out[id]='Jugador';
  return out;
}
function miniCanvas(type,size){const c=document.createElement('canvas');c.width=c.height=size*2;c.style.width=c.style.height=size+'px';drawPreview(c,type,false);return c}
let renderSeq=0;

    list.innerHTML='<div class="empty">El ranking y los retos no están disponibles ahora mismo. Puedes seguir jugando sin conexión.</div>';return}

  $('nickRow').hidden=canWrite===false;

    else{tb.textContent='Sin equipo defensor';ts.textContent='Pon tu equipo para que otros lo reten'}
    t.append(tb,ts);d.appendChild(t);
    const bt=document.createElement('button');bt.className='gold';bt.textContent=cur?'Actualizar':'Poner equipo';
    bt.disabled=canWrite===false;
    bt.onclick=()=>{save.def={team:save.team.map(k=>({ball:k,lv:lvOf(k)})),map:save.map==='random'?'clasica':save.map};persist();pushOnline();toast('Tu equipo defiende tu puesto');renderOnline()};
    d.appendChild(bt);defBox.appendChild(d);
    const rows=players.filter(p=>p.def&&p.id!==myId).sort((a,b)=>b.wins-a.wins);
    if(!rows.length){list.innerHTML='<div class="empty">Nadie ha puesto aún una bola defensora. Cuando otro jugador lo haga, podrás retarla aquí.</div>';return}
    rows.forEach(p=>{
      const r=document.createElement('div');r.className='orow';r.style.gridTemplateColumns='auto 1fr auto';
      const ic=document.createElement('div');ic.style.display='flex';for(const t of p.def.team)ic.appendChild(miniCanvas(t.ball,26));r.appendChild(ic);
      const w=document.createElement('div');w.className='who';const b=document.createElement('b');b.textContent=names[p.id];
      const sm=document.createElement('small');sm.textContent=p.def.team.map(x=>TYPES[x.ball].name+' '+x.lv).join(' · ')+' · '+ARENAS[p.def.map].name;w.append(b,sm);r.appendChild(w);
      const go=document.createElement('button');go.className='main';go.textContent='Retar';
      go.onclick=()=>{initAudio();const ch={team:p.def.team,map:p.def.map,name:names[p.id]};openTeam(()=>{challenge=ch;startMatch()},'Reto al mejor de 3 contra '+names[p.id]+'. Elige tu equipo.')};
      r.appendChild(go);list.appendChild(r);
    });
  }
}

$('bBack2').onclick=()=>show('home');
$('tabRank').onclick=()=>{onTab='rank';renderOnline()};
$('tabRetos').onclick=()=>{onTab='retos';renderOnline()};
$('bNick').onclick=()=>{const v=cleanNick($('nick').value);if(!v){toast('Escribe un nombre');return}save.nick=v;persist();pushOnline();toast('Nombre guardado');$('nick').blur();renderOnline()};
$('bPlay').onclick=togglePlay;
let aiming=false;
function arenaPoint(e){const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)/S,y:(e.clientY-r.top)/S}}
function aimAt(p){const b=balls[0],dx=p.x-b.x,dy=p.y-b.y,l=Math.hypot(dx,dy);if(l>15){b.vx=dx/l;b.vy=dy/l}}
stage.addEventListener('pointerdown',e=>{
  if(e.target.closest('button'))return;
  if(state==='ready'&&!(net&&net.aimRd===net.rd)){initAudio();aiming=true;ov.hidden=true;try{stage.setPointerCapture(e.pointerId)}catch(_){}aimAt(arenaPoint(e));return}
  if(state==='paused')togglePlay();
});
stage.addEventListener('pointermove',e=>{if(aiming&&state==='ready')aimAt(arenaPoint(e))});
stage.addEventListener('pointerup',e=>{if(!aiming)return;aiming=false;if(state==='ready'){aimAt(arenaPoint(e));beep(500,.12,'triangle',.07,2);if(net){if(net.aimRd!==net.rd){net.aimRd=net.rd;netAimDone(Math.atan2(balls[0].vy,balls[0].vx))}}else start()}});
stage.addEventListener('pointercancel',()=>{aiming=false});
$('bSpd').onclick=()=>{speed=speed>=3?1:speed+1;$('bSpd').textContent='x'+speed};
$('bSnd').onclick=()=>{soundOn=!soundOn;save.settings.sound=soundOn;persist();$('bSnd').textContent=soundOn?'🔊':'🔇';if(!soundOn)stopMusic();initAudio()};
$('bFight').onclick=()=>{initAudio();openTeam(()=>{startMatch()})};
$('bTour').onclick=()=>{initAudio();openTeam(()=>{tour={stage:1};startMatch()},'Torneo de 3 fases al mejor de 3. Elige tu equipo.')};
$('bBack5').onclick=()=>show('home');
$('bTeamGo').onclick=()=>{if(teamSel.length<3)return;save.team=teamSel.slice();persist();const cb=teamCb;cb&&cb()};
$('bSuper').onclick=()=>{initAudio();if(net&&net.role==='guest'){if(balls[0]&&balls[0].sp>=1&&playing()){net.supN++;pub({sup:net.supN});balls[0].sp=0;fightStats.supers++}}else useSuper(balls[0])};
$('bShop').onclick=()=>show('shop');
$('bBack').onclick=()=>show('home');
$('bMap').onclick=()=>{const list=['random'].concat(MAPKEYS);save.map=list[(list.indexOf(save.map)+1)%list.length];persist();renderHome()};
$('bUp').onclick=()=>{const k=save.sel,lv=lvOf(k);if(lv>=MAXLV)return;const c=upCost(k);
  if(save.coins<c){toast('Te faltan '+(c-save.coins)+' monedas');return}
  initAudio();save.coins-=c;save.lv[k]=lv+1;persist();setCoins(true);toast(TYPES[k].name+' sube a nivel '+(lv+1));
  beep(523,.1,'square',.06);setTimeout(()=>beep(784,.1,'square',.06),90);setTimeout(()=>beep(1046,.2,'square',.06),180);renderHome();pushOnline()};
window.addEventListener('resize',resize);
new ResizeObserver(resize).observe(stage);

migrateSave();persist();i18nInit();setCoins();show('home');requestAnimationFrame(frame);initOnline();
$('bGear').onclick=()=>{initAudio();showSettings()};
setTimeout(()=>{if(!(save.tut&&checkInviteHash()))startupModals()},300);
$('coins').onclick=()=>{initAudio();freeCoinsModal()};
$('bFriends').onclick=()=>{initAudio();friendsModal()};
$('pchip').onclick=()=>{initAudio();profileModal()};
window.addEventListener('hashchange',checkInviteHash);
adsInit();
bgInit();
$('bSkin').onclick=()=>{initAudio();openSkins(save.sel)};
$('bEmo').onclick=()=>{const p=$('emoPanel');p.hidden=!p.hidden};
EMOTES.forEach((e,i)=>{const b=document.createElement('button');b.textContent=e;b.onclick=()=>sendEmote(i);$('emoPanel').appendChild(b)});
})();
</script>
<script>if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});</script>
</body>
</html>
