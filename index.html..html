<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1424">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Ball Battle: batallas de bolas con poderes. Juega online, sube copas y desbloquea arenas.">
<title>Ball Battle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Rubik:wght@500;700&display=swap">
<style>
/* Layout: portrait phone app — top bar with coins; views swap below: home (your ball + upgrade + map), fight (cards + square arena + thumb controls), shop (rarity tabs + 2-col grid) */
:root{
  --night:#0b1424;
  --neon:#56f0ff;
  --gold:#ffc83d;
  --win:#7dff8a;
  --dmg:#ff2b3a;
  --ink:#eaf6ff;
  --muted:#8aa3c4;
  --panel:#16233a;
  --panel2:#1d2e4b;
  --common:#a9b8cc;
  --rare:#4fa8ff;
  --epic:#c06bff;
  --legend:#ffb02e;
  --display:"Lilita One","Arial Black",system-ui,sans-serif;
  --body:"Rubik",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{font-size:14px}
img{max-width:100%}
body{background:var(--night);color:var(--ink);font-family:var(--body);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.app{height:100%;display:flex;flex-direction:column;gap:10px;
  padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  box-sizing:border-box;max-width:560px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.title{font-family:var(--display);font-size:clamp(18px,5.4vw,26px);margin:0;letter-spacing:.3px;text-shadow:0 3px 0 #000a;line-height:1.05;min-width:0;text-wrap:balance;font-weight:400}
.title .vs{color:var(--muted);font-size:.7em;padding:0 .25em}
.coins{font-family:var(--display);font-size:20px;color:var(--gold);background:var(--panel);border-radius:999px;padding:6px 14px 6px 8px;
  display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums;flex-shrink:0;transition:transform .15s}
.coins.bump{transform:scale(1.18)}
.coin{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b0,var(--gold) 55%,#b8860b);box-shadow:inset 0 -2px 0 #0004;display:inline-block;flex-shrink:0}
.view{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.chip{font-size:10px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:#0006;display:inline-block}
.r-common{color:var(--common)} .r-rare{color:var(--rare)} .r-epic{color:var(--epic)} .r-legend{color:var(--legend)}

/* home */
.home{align-items:center;gap:9px;overflow-y:auto;text-align:center}
.home>*{flex-shrink:0}
.home .spacer{flex:1;min-height:0}
.home h2{font-family:var(--display);font-size:clamp(30px,9vw,46px);margin:0;line-height:1;font-weight:400}
.home p{margin:0;color:var(--muted);max-width:34ch;line-height:1.4;font-size:14px}
.stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.stat{background:var(--panel);border-radius:10px;padding:6px 10px;font-size:12px;color:var(--muted);font-weight:700}
.stat b{color:var(--ink);font-family:var(--display);font-weight:400;font-size:15px;margin-left:4px}
.lvl{display:flex;gap:4px}
.lvl i{width:18px;height:6px;border-radius:3px;background:var(--panel2)}
.lvl i.on{background:var(--gold)}
.home .btns{display:grid;gap:10px;width:min(100%,360px)}
.home .btns .two{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.home .btns .two button{font-size:16px;padding:12px 6px}
.owned{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:360px}
.owned button{width:40px;height:40px;padding:0;border-radius:50%;background:var(--panel);box-shadow:none;border:3px solid transparent}
.owned button.on{border-color:var(--neon)}
.owned canvas{width:100%;height:100%;display:block;border-radius:50%}
.record{font-family:var(--display);font-size:15px;display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.record b{color:var(--win);font-weight:400} .record i{font-style:normal;color:var(--dmg)} .record u{text-decoration:none;color:var(--gold)}
.mapbtn{width:100%;background:var(--panel);color:var(--ink);box-shadow:none;justify-content:space-between;padding:10px 14px;font-size:16px}
.mapbtn small{font-family:var(--body);font-size:12px;color:var(--muted);font-weight:700}

/* fight */
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--panel);border-radius:14px;padding:9px 12px;display:flex;flex-direction:column;gap:5px;min-width:0}
.card .who{font-size:10px;letter-spacing:1.6px;font-weight:700;color:var(--muted);text-transform:uppercase;display:flex;justify-content:space-between}
.card .who span{color:var(--gold)}
.card .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.card .name{font-family:var(--display);font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .hp{font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:6px;background:#0007;overflow:hidden;position:relative}
.bar i{position:absolute;inset:0;transform-origin:left;transition:transform .15s}
.bar b{position:absolute;inset:0;transform-origin:left;background:#fff6;transition:transform .7s .25s}
.card .skill{font-size:11px;color:var(--muted);line-height:1.3}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;touch-action:none}
#cv{display:block;border-radius:10px;box-shadow:0 0 0 3px #2b4a75,0 18px 40px #0009}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;pointer-events:none;padding:16px}
.overlay .big{font-family:var(--display);font-size:clamp(34px,11vw,56px);line-height:1;text-shadow:0 4px 0 #000,0 0 30px #000}
.overlay .small{font-size:15px;color:var(--ink);text-shadow:0 2px 4px #000;font-weight:700;line-height:1.4}
.overlay .tag{font-family:var(--display);font-size:16px;background:#000a;padding:6px 14px;border-radius:999px;line-height:1.2}
.overlay .tag small{display:block;font-family:var(--body);font-size:12px;color:var(--muted);font-weight:700}
.overlay .reward{display:grid;gap:4px;background:#000b;border-radius:14px;padding:10px 16px;min-width:200px}
.overlay .reward div{display:flex;justify-content:space-between;gap:16px;font-weight:700;font-size:14px}
.overlay .reward div b{font-family:var(--display);font-weight:400;color:var(--gold);font-size:18px}
.overlay .reward .tot{border-top:1px solid #fff3;padding-top:6px;font-size:16px}
.overlay .row{display:flex;gap:10px;pointer-events:auto}
.controls{display:grid;grid-template-columns:1.6fr 1fr .75fr .75fr;gap:8px;padding-bottom:4px}
.controls button{padding:14px 6px}
button.super{background:linear-gradient(90deg,var(--gold) calc(var(--p,0) * 100%),var(--panel2) 0);color:var(--ink);font-size:16px;text-shadow:0 2px 0 #0008}
button.super.ready{background:var(--gold);color:var(--night);text-shadow:none;animation:pulse .5s infinite alternate}
button.super:disabled{cursor:default}
@keyframes pulse{to{transform:scale(1.05);box-shadow:0 0 26px var(--gold)}}
.sbar{height:4px;border-radius:2px;background:#0006;overflow:hidden}
.sbar i{display:block;height:100%;background:var(--gold);transform-origin:left;transform:scaleX(0)}
button.tour{background:var(--epic);color:#fff}
button.online{background:var(--panel);color:var(--neon);box-shadow:inset 0 0 0 2px var(--neon);width:100%;font-size:17px;padding:11px}
.pickfoe{display:flex;align-items:center;gap:12px;background:#000b;border-radius:14px;padding:6px 14px 6px 6px;text-align:left}
.pickfoe canvas{width:52px;height:52px}
.pickfoe small{display:block;font-size:11px;color:var(--muted);font-weight:700;letter-spacing:1px;text-transform:uppercase}
.pickfoe b{font-family:var(--display);font-weight:400;font-size:18px}
.pickrow{display:flex;gap:8px;pointer-events:auto}
.pickbtn{flex-direction:column;gap:2px;width:88px;padding:8px 4px;background:var(--panel);color:var(--ink);font-size:14px;box-shadow:0 4px 0 #0008,inset 0 0 0 2px var(--neon)}
.pickbtn canvas{width:52px;height:52px}
.pickbtn small{font-family:var(--body);font-size:11px;color:var(--muted);font-weight:700}
.pickbtn:disabled{opacity:.35;box-shadow:none}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{background:var(--panel2);border-radius:14px;height:92px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:var(--display);font-size:14px;color:var(--muted);border:2px dashed #ffffff22}
.slot.on{border:2px solid var(--neon);color:var(--ink)}
.slot canvas{width:56px;height:56px}
.grid.tgrid{grid-template-columns:repeat(4,1fr);gap:8px}
.tpick{flex-direction:column;gap:2px;padding:8px 2px;background:var(--panel);color:var(--ink);font-size:13px;box-shadow:none;position:relative;min-width:0}
.tpick.on{box-shadow:inset 0 0 0 3px var(--neon)}
.tpick canvas{width:48px;height:48px}
.tpick span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tpick small{font-family:var(--body);font-size:10px;color:var(--muted);font-weight:700}
.tpick i{position:absolute;top:4px;right:6px;font-style:normal;background:var(--neon);color:var(--night);border-radius:50%;width:20px;height:20px;line-height:20px;font-size:12px}
#bTeamGo:disabled{background:var(--panel2);color:var(--muted);box-shadow:none}
.cupi{width:1em;height:1em;vertical-align:-.12em;color:var(--gold)}
.arenaban{width:min(100%,360px);display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;text-align:left;padding:10px 14px;border-radius:16px;
  background:linear-gradient(120deg,var(--ac,#4fa8ff) -40%,var(--panel) 55%);color:var(--ink);box-shadow:0 4px 0 #0008,inset 0 0 0 2px var(--ac,#4fa8ff)}
.arenaban .arl small{display:block;font-family:var(--body);font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:#ffffffcc}
.arenaban .arl b{font-family:var(--display);font-weight:400;font-size:20px}
.arenaban .troph{font-family:var(--display);font-size:26px;color:var(--gold);display:flex;align-items:center;gap:4px}
.arenaban .arbar{grid-column:1/-1;height:8px;border-radius:4px;background:#0007;overflow:hidden;display:block}
.arenaban .arbar i{display:block;height:100%;background:var(--gold);transform-origin:left}
.arenaban .arnext{grid-column:1/-1;font-family:var(--body);font-size:11px;font-weight:700;color:#ffffffaa}
button.battle{flex-direction:column;gap:0;line-height:1.05;background:var(--gold)}
button.battle small{font-family:var(--body);font-size:12px;font-weight:700;opacity:.75}
.cupdelta{font-family:var(--display);font-size:30px;text-shadow:0 3px 0 #000;display:flex;align-items:baseline;gap:8px}
.cupdelta.up{color:var(--gold)} .cupdelta.down{color:#ff6b6b}
.cupdelta small{font-family:var(--body);font-size:13px;color:var(--ink);font-weight:700}
.road{background:var(--panel);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;box-shadow:inset 4px 0 0 var(--ac)}
.road.cur{box-shadow:inset 0 0 0 2px var(--ac)}
.road.lock{opacity:.55}
.road .rhead{display:flex;align-items:baseline;gap:8px}
.road .rnum{font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--ac)}
.road b{font-family:var(--display);font-weight:400;font-size:18px;flex:1;min-width:0}
.road .rmin{font-family:var(--display);color:var(--gold);font-size:16px}
.road small{font-size:12px;color:var(--muted);font-weight:700}
.rballs{display:flex;gap:4px;flex-wrap:wrap}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.badge{background:var(--dmg);color:#fff;font-size:13px;border-radius:999px;padding:1px 8px;margin-left:4px}
.mis{background:var(--panel);border-radius:14px;padding:12px;display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center}
.mis.done{opacity:.55}
.mis b{font-family:var(--display);font-weight:400;font-size:17px}
.mis .pb{grid-column:1/-1;height:8px;border-radius:4px;background:#0007;overflow:hidden}
.mis .pb i{display:block;height:100%;background:var(--neon);transform-origin:left}
.mis small{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-top:2px}
.mis button{font-size:15px;padding:9px 12px}
.nickrow{display:flex;gap:8px}
.nickrow input{flex:1;min-width:0;font:700 16px var(--body);color:var(--ink);background:var(--panel);border:2px solid var(--panel2);border-radius:12px;padding:10px 12px;-webkit-user-select:text;user-select:text}
.nickrow input:focus{outline:none;border-color:var(--neon)}
.nickrow button{padding:10px 14px;font-size:16px}
.olist{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-bottom:8px}
.orow{background:var(--panel);border-radius:14px;padding:8px 10px;display:grid;grid-template-columns:28px 40px 1fr auto;gap:10px;align-items:center;min-width:0}
.orow.me{box-shadow:inset 0 0 0 2px var(--neon)}
.orow .pos{font-family:var(--display);font-size:18px;color:var(--muted);text-align:center}
.orow:nth-child(1) .pos{color:var(--gold)}
.orow canvas{width:40px;height:40px}
.orow .who{min-width:0}
.orow .who b{display:block;font-family:var(--display);font-weight:400;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.orow .who small{display:block;font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.orow .num{font-family:var(--display);font-size:18px;text-align:right;font-variant-numeric:tabular-nums;line-height:1.1}
.orow .num small{display:block;font-family:var(--body);font-size:10px;color:var(--muted);font-weight:700;letter-spacing:1px;text-transform:uppercase}
.orow button{padding:9px 14px;font-size:15px}
.defcard{background:var(--panel2);border-radius:14px;padding:10px 12px;display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center}
.defcard canvas{width:44px;height:44px}
.defcard b{font-family:var(--display);font-weight:400;font-size:16px;display:block}
.defcard small{font-size:12px;color:var(--muted);font-weight:700}
.defcard button{font-size:14px;padding:9px 10px}
.empty{color:var(--muted);text-align:center;font-size:14px;padding:24px 8px;line-height:1.5}

/* shop */
.shophead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.shophead h2{font-family:var(--display);font-size:28px;margin:0;font-weight:400}
.shophead p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;flex-shrink:0}
.tabs button{font-size:13px;padding:8px 12px;border-radius:999px;background:var(--panel);color:var(--muted);box-shadow:none;white-space:nowrap}
.tabs button.on{background:var(--ink);color:var(--night)}
.grid{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:start;padding-bottom:8px;-webkit-overflow-scrolling:touch}
.item{background:var(--panel);border-radius:16px;padding:10px 10px 12px;display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;min-width:0;position:relative}
.item.sel{box-shadow:inset 0 0 0 3px var(--neon)}
.item .chip{position:absolute;top:8px;left:8px}
.item .lv{position:absolute;top:8px;right:10px;font-family:var(--display);font-size:13px;color:var(--gold)}
.item canvas{width:88px;height:88px;margin-top:12px}
.item h3{font-family:var(--display);font-size:19px;margin:0;font-weight:400}
.item p{font-size:12px;color:var(--muted);margin:0;line-height:1.35;flex:1}
.item .st{font-size:11px;color:var(--ink);opacity:.8;font-weight:700}
.item button{width:100%;font-size:16px;padding:10px 6px}

button{font-family:var(--display);font-size:18px;color:var(--night);border:0;border-radius:14px;padding:14px 10px;cursor:pointer;
  background:var(--ink);box-shadow:0 4px 0 #0008;touch-action:manipulation;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button:active{transform:translateY(2px);box-shadow:0 2px 0 #0008}
button:focus-visible{outline:3px solid var(--neon);outline-offset:2px}
button.main{background:var(--neon)}
button.big{font-size:24px;padding:16px}
button.ghost{background:var(--panel);color:var(--ink)}
button.gold{background:var(--gold)}
button.lock{background:var(--panel2);color:var(--muted);box-shadow:none}
button.done{background:transparent;color:var(--neon);box-shadow:none}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--gold);color:var(--night);
  font-family:var(--display);font-size:18px;padding:10px 18px;border-radius:999px;box-shadow:0 6px 20px #0008;z-index:20;white-space:nowrap}
@media (prefers-reduced-motion:reduce){.bar i,.bar b,.coins{transition:none}button.super.ready{animation:none}}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <h1 class="title" id="title">Ball Battle</h1>
    <div class="coins" id="coins"><span class="coin"></span><span id="coinN">0</span></div>
  </header>

  <section class="view home" id="home">
    <button class="arenaban" id="bArena">
      <span class="arl"><small id="arNum">Arena 1</small><b id="arName">Patio de Bolas</b></span>
      <span class="troph" id="trN">0</span>
      <span class="arbar"><i id="arBar"></i></span>
      <small class="arnext" id="arNext"></small>
    </button>
    <div class="spacer"></div>
    <span class="chip" id="homeRar"></span>
    <canvas id="homeCv" width="400" height="400" style="width:130px;height:130px"></canvas>
    <h2 id="homeName">Harpoon</h2>
    <div class="lvl" id="homeLvl"></div>
    <p id="homeDesc"></p>
    <div class="stats" id="homeStats"></div>
    <div class="record"><span>Victorias <b id="recW">0</b></span><span>Derrotas <i id="recL">0</i></span><span>Racha <u id="recS">0</u></span><span>Torneos <u id="recT">0</u></span><span>Retos <u id="recR">0</u></span></div>
    <div class="owned" id="owned"></div>
    <div class="btns">
      <button class="main big battle" id="bBattle">¡Batalla!<small>Online · copas</small></button>
      <div class="two">
        <button class="ghost" id="bFight">Práctica</button>
        <button class="tour" id="bTour">Torneo</button>
        <button class="ghost" id="bShop">Tienda</button>
      </div>
      <div class="two">
        <button class="gold" id="bUp">Mejorar</button>
        <button class="online" id="bMis">Misiones <span class="badge" id="misBadge" hidden>0</span></button>
        <button class="online" id="bOnline">Ranking</button>
      </div>
      <button class="mapbtn" id="bMap"><span>Mapa de práctica: <span id="mapName">Aleatorio</span></span><small>Cambiar</small></button>
    </div>
    <div class="spacer"></div>
  </section>

  <section class="view" id="fight" hidden>
    <div class="cards">
      <div class="card">
        <div class="who">Tú <span id="lv0"></span></div>
        <div class="row"><span class="name" id="nm0"></span><span class="hp" id="hp0">100</span></div>
        <div class="bar"><b id="gh0"></b><i id="bar0"></i></div>
        <div class="sbar"><i id="sb0"></i></div>
        <div class="skill" id="sk0"></div>
      </div>
      <div class="card">
        <div class="who">Rival <span id="lv1"></span></div>
        <div class="row"><span class="name" id="nm1"></span><span class="hp" id="hp1">100</span></div>
        <div class="bar"><b id="gh1"></b><i id="bar1"></i></div>
        <div class="sbar"><i id="sb1"></i></div>
        <div class="skill" id="sk1"></div>
      </div>
    </div>
    <div class="stage" id="stage">
      <canvas id="cv"></canvas>
      <div class="overlay" id="ov"></div>
    </div>
    <div class="controls">
      <button class="super" id="bSuper" disabled>SÚPER</button>
      <button class="main" id="bPlay">Empezar</button>
      <button class="ghost" id="bSpd">x1</button>
      <button class="ghost" id="bSnd">🔊</button>
    </div>
  </section>

  <section class="view" id="online" hidden>
    <div class="shophead">
      <div><h2>Online</h2><p id="onStatus">Conectando…</p></div>

<script>
/* Firebase adapter: gives the game the same small API it uses for db / user / room. */
(function(){
  if(!FIREBASE_CONFIG||!window.firebase)return;
  let app,auth,rt;
  try{app=firebase.initializeApp(FIREBASE_CONFIG);auth=firebase.auth();rt=firebase.database()}catch(e){console.warn('Firebase no se pudo iniciar',e);return}
  const ready=auth.signInAnonymously().then(c=>c.user.uid).catch(e=>{console.warn('Login anónimo falló',e);return null});
  const tab=Math.random().toString(36).slice(2,10);
  const clean=v=>JSON.parse(JSON.stringify(v===undefined?null:v));
  function makeRoom(name,uid){
    const ref=rt.ref('rooms/'+name),me=uid+'_'+tab,myRef=ref.child(me);
    let peersArr=Object.freeze([]),myP={},timer=null,conn=true;const hs=new Set();
    const cb=snap=>{const v=snap.val()||{};
      peersArr=Object.freeze(Object.entries(v).filter(([k,n])=>n&&typeof n==='object').map(([k,n])=>Object.freeze({peer:k,by:n.uid||null,isMe:k===me,sameTab:k===me,kind:'viewer',guest:false,presence:n.p&&typeof n.p==='object'?n.p:{},updatedAt:Date.now()})));
      hs.forEach(h=>{try{h({peers:peersArr,joined:[],left:[],updated:[]})}catch(e){}})};
    ref.on('value',cb,()=>{conn=false});
    myRef.onDisconnect().remove();
    function flush(){timer=null;myRef.set({uid,p:clean(myP)}).catch(()=>{})}
    return {name,
      presence(patch){for(const k in patch){if(patch[k]===null)delete myP[k];else myP[k]=patch[k]}if(!timer)timer=setTimeout(flush,45);return Promise.resolve()},
      peers(){return peersArr},
      onPeers(h){hs.add(h);setTimeout(()=>h({peers:peersArr,joined:[],left:[],updated:[]}),0);return()=>hs.delete(h)},
      emit(){return Promise.resolve()},on(){return()=>{}},
      connected(){return conn},onConnection(h){setTimeout(()=>h(conn),0);return()=>{}},
      leave(){ref.off('value',cb);hs.clear();if(timer){clearTimeout(timer);timer=null}myRef.onDisconnect().cancel();return myRef.remove().catch(()=>{})}};
  }
  const api={};
  ready.then(uid=>{
    if(!uid)return;
    api.user={id:async()=>uid,can:async()=>true,isOwner:async()=>false,canEdit:async()=>false,
      me:async()=>({id:uid,name:'',email:null,isOwner:false,canEdit:false}),
      profiles:async ids=>Object.fromEntries([].concat(ids).map(i=>[i,{id:i,name:'',guest:false,isMe:i===uid}]))};
    api.db={
      collection(path){return{onSnapshot(next,err){const q=rt.ref(path).orderByChild('trophies').limitToLast(200);
        const cb=s=>{const docs=[];s.forEach(c=>{const d=c.val();docs.push({id:c.key,exists:true,data:()=>d})});next({docs,size:docs.length,empty:!docs.length})};
        q.on('value',cb,()=>{err&&err({code:'unavailable',message:'sin acceso'})});return()=>q.off('value',cb)}}},
      doc(path){const r=rt.ref(path);return{set:d=>r.set(clean(d)),get:async()=>{const s=await r.get();return{id:s.key,exists:s.exists(),data:()=>s.val()}}}}};
    const lobby=makeRoom('lobby',uid);
    lobby.join=async n=>{if(!/^[a-z0-9][a-z0-9_.-]{0,47}$/.test(n)||n.includes('.'))throw {code:'invalid_argument'};return makeRoom(n,uid)};
    api.room=lobby;
  });
  window.claude={use:async n=>{await ready;return api[n]||null}};
})();
</script>

/* ---------- sound ---------- */
let actx=null, soundOn=true;
function beep(f,d=.08,type='square',v=.06,slide=0){
  if(!soundOn||!actx) return;

    const t=actx.currentTime,o=actx.createOscillator(),g=actx.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t+d);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g).connect(actx.destination);o.start(t);o.stop(t+d+.02);
  }catch(e){}
}

function musicTick(){
  if(!music||!actx)return;const sp=.19;

function damage(b,n,x,y,raw){

  let crit=false;

    if(!a.dead)a.sp=Math.min(1,a.sp+n*.012)}
  b.sp=Math.min(1,b.sp+n*.008);
  if(!raw&&b===balls[1]){fightStats.dmg+=n;if(crit)fightStats.crits++}
  b.hp=Math.max(0,b.hp-n); b.flash=.12; b.squash=.25;
  pops.push({x:x+rnd(-25,25),y:y-rnd(0,30),t:0,txt:'-'+n+(crit?'!':''),big:n>=5||crit,c:crit?'#ffd23d':'#ff2b3a',s:crit?1.3:1});

  for(let i=0;i<5;i++) spark(b.x,b.y,'#ffffff');
  if(net&&net.role==='host')net.ev.push([++net.evId,Math.round(x),Math.round(y),n,crit?1:0]);
  if(b.hp<=0) ko(b);
  else if(!raw&&b.type==='espejo'){const a=enemyOf(b);if(!a.dead){const r=Math.max(1,Math.round(n*.4));pops.push({x:a.x,y:a.y-a.r,t:0,txt:'REFLEJO',big:false,c:'#d6e6ff',s:.6});damage(a,r,a.x,a.y,true)}}
}

/* ---------- simulation step ---------- */
function circleBounce(b,p){
  const dx=b.x-p.x,dy=b.y-p.y,d=Math.hypot(dx,dy),m=b.r+p.r;
  if(d<m&&d>0){const nx=dx/d,ny=dy/d;b.x=p.x+nx*m;b.y=p.y+ny*m;const v=b.vx*nx+b.vy*ny;if(v<0){b.vx-=2*v*nx;b.vy-=2*v*ny}b.squash=.15;return true}
  return false;
}
function bounceWall(b){
  const lo=inset(),hi=W-lo;
  let hit=false;
  if(b.x<lo+b.r){b.x=lo+b.r;b.vx=Math.abs(b.vx);hit=true}
  if(b.x>hi-b.r){b.x=hi-b.r;b.vx=-Math.abs(b.vx);hit=true}
  if(b.y<lo+b.r){b.y=lo+b.r;b.vy=Math.abs(b.vy);hit=true}
  if(b.y>hi-b.r){b.y=hi-b.r;b.vy=-Math.abs(b.vy);hit=true}
  if(hit&&TYPES[b.type].onWall)TYPES[b.type].onWall(b);
  if(hit){b.squash=.12;if(arena.lava&&b.wallCd<=0&&playing()){b.wallCd=.4;damage(b,2,b.x,b.y,true);for(let i=0;i<5;i++)spark(b.x,b.y,'#ff6a2a')}}
  for(const p of arena.pillars||[])circleBounce(b,p);
  for(const p of arena.bumpers||[])if(circleBounce(b,p)){b.boostT=.45;p.hitT=.18;beep(880,.07,'square',.05,1.4);ring(p.x,p.y,'#ff4df2')}
  if(arena.portals&&b.tpCd<=0){
    const P=arena.portals;
    for(let i=0;i<2;i++)if(Math.hypot(b.x-P[i].x,b.y-P[i].y)<36){
      const o=P[1-i];ring(b.x,b.y,P[i].c);b.x=o.x;b.y=o.y;b.tpCd=1;ring(o.x,o.y,o.c);beep(600,.15,'sine',.05,2.5);break}
  }
}
function contactAll(s,o){
  const T=TYPES[s.type];if(T.onContact&&playing())T.onContact(s,o);
  if(s.extra){const X=TYPES[s.extra];if(X.onContact&&playing()&&!o.dead)X.onContact(s,o)}
}
function useSuper(b){
  if(!b||b.sp<1||!playing()||b.dead)return;
  b.sp=0;b.supT=SUPER.dash;b.shield=SUPER.shield;if(b===balls[0])fightStats.supers++;
  pops.push({x:b.x,y:b.y-b.r-20,t:0,txt:'¡SÚPER!',big:true,c:'#ffc83d',s:.9});
  beep(300,.35,'sawtooth',.08,3);ring(b.x,b.y,'#ffc83d');if(b===balls[0])buzz(40);
}
function superBlast(b){
  const e=enemyOf(b);
  fx.push({k:'gold',x:b.x,y:b.y,t:0,life:.5,R:SUPER.R});shake+=16;flash=Math.max(flash,.25);
  beep(80,.5,'sawtooth',.12,.4);buzz(50);
  for(let i=0;i<24;i++)spark(b.x,b.y,i%2?'#ffc83d':'#ffffff');
  if(!e.dead&&Math.hypot(e.x-b.x,e.y-b.y)<SUPER.R+e.r*.3){
    damage(e,SUPER.dmg,e.x,e.y);
    if(!e.hooked){const a=Math.atan2(e.y-b.y,e.x-b.x);e.vx=Math.cos(a);e.vy=Math.sin(a);e.boostT=.4}
  }
}
function step(dt){
  time+=dt;
  for(const p of arena.bumpers||[])p.hitT=Math.max(0,(p.hitT||0)-dt);
  for(const b of balls){
    if(b.dead) continue;
    b.flash=Math.max(0,b.flash-dt);b.squash=Math.max(0,b.squash-dt);b.hitCd=Math.max(0,b.hitCd-dt);
    b.slowT=Math.max(0,b.slowT-dt);b.burnCd=Math.max(0,b.burnCd-dt);b.wallCd=Math.max(0,b.wallCd-dt);
    b.boostT=Math.max(0,b.boostT-dt);b.tpCd=Math.max(0,b.tpCd-dt);
    const T=TYPES[b.type];
    b.stunT=Math.max(0,(b.stunT||0)-dt);
    if(!b.hooked&&!b.latch&&!(b.stunT>0)){
      const sp=T.speed*b.mul*(b.slowT>0?.6:1)*(arena.speedMul||1)*(b.dashT>0?2.8:1)*(b.boostT>0?1.8:1)*(b.supT>0?3:1)*(b.boss?.85:1), cur=Math.hypot(b.vx,b.vy)||1;
      b.vx=b.vx/cur*sp;b.vy=b.vy/cur*sp;
      b.x+=b.vx*dt;b.y+=b.vy*dt;
      bounceWall(b);
    }
    if(T.update) T.update(b,dt);
    if(b.extra){const X=TYPES[b.extra];if(X.update){const s=b.t1;b.t1=b.t2;X.update(b,dt*.5);b.t2=b.t1;b.t1=s}}
    b.shield=Math.max(0,b.shield-dt);
    if(playing()){
      b.sp=Math.min(1,b.sp+dt/SUPER.charge);
      if(!net&&b!==balls[0]&&b.sp>=1&&Math.random()<dt*.7)useSuper(b);
      if(b.supT>0){const e=enemyOf(b);b.supT-=dt;
        if(e.dead)b.supT=0;
        else{steer(b,e.x,e.y,10,dt);if(Math.hypot(e.x-b.x,e.y-b.y)<b.r+e.r+12||b.supT<=0){b.supT=0;superBlast(b)}}}
    }
    if(b.psn.length&&playing()){
      b.psn=b.psn.map(t=>t-dt).filter(t=>t>0);b.psnT-=dt;
      if(b.psnT<=0&&b.psn.length){b.psnT=.5;damage(b,b.psn.length,b.x,b.y-20)}
    }
    if(Math.random()<.5){b.trail.push({x:b.x,y:b.y});if(b.trail.length>7)b.trail.shift()}
  }
  objs=objs.filter(o=>o.update(dt)!==false);
  const [a,c]=balls;
  if(!a.dead&&!c.dead&&!a.hooked&&!c.hooked&&!a.latch&&!c.latch&&a.ghost<=0&&c.ghost<=0){
    const dx=c.x-a.x,dy=c.y-a.y,dist=Math.hypot(dx,dy),min=a.r+c.r;
    if(dist<min&&dist>0){
      const nx=dx/dist,ny=dy/dist,o=(min-dist)/2;
      a.x-=nx*o;a.y-=ny*o;c.x+=nx*o;c.y+=ny*o;
      const va=a.vx*nx+a.vy*ny, vc=c.vx*nx+c.vy*ny;
      if(va-vc>0){a.vx+=(vc-va)*nx;a.vy+=(vc-va)*ny;c.vx+=(va-vc)*nx;c.vy+=(va-vc)*ny}
      if(a.hitCd<=0&&c.hitCd<=0){
        a.hitCd=c.hitCd=.35;a.squash=c.squash=.2;beep(180,.05,'square',.04);
        contactAll(a,c);
        if(!a.dead&&!c.dead) contactAll(c,a);
      }
    }
  }
  if(state==='ko')koT+=dt;
  if(playing()){fightT+=dt;
    if(fightT>=SUDDEN.at){
      if(!sudden){sudden=true;pops.push({x:W/2,y:W/2,t:-.6,txt:'¡MUERTE SÚBITA!',big:true,c:'#ffc83d',s:1});beep(200,.5,'sawtooth',.08,.5)}
      sdT+=dt;if(sdT>=SUDDEN.every){sdT=0;for(const b of[...balls].sort(()=>Math.random()-.5))if(playing())damage(b,SUDDEN.dmg,b.x,b.y,true)}
    }}
}
function updFx(dt){
  for(const p of fx){p.t+=dt;if(p.vx!==undefined){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.96;p.vy*=.96}if(p.k==='q'){p.vy+=600*dt;p.rot+=p.vr*dt}if(p.k==='conf'){p.vy+=500*dt;p.rot+=p.vr*dt}}
  fx=fx.filter(p=>p.t<p.life);
  for(const p of pops){p.t+=dt;p.y-=70*dt}
  pops=pops.filter(p=>p.t<.9);
  shake*=Math.pow(.02,dt);flash=Math.max(0,flash-dt*1.8);

  cv.style.width=cv.style.height=size+'px';cv.width=cv.height=Math.floor(size*dpr);
  S=size/W;
}
function drawArena(){

  ctx.fillStyle=g;ctx.fillRect(0,0,W,W);

  if(arena.lava){ctx.save();ctx.globalAlpha=.5+Math.sin(time*3)*.2;
    for(let s=0;s<4;s++){ctx.save();ctx.translate(W/2,W/2);ctx.rotate(s*Math.PI/2);ctx.translate(-W/2,-W/2);
      const gg=ctx.createLinearGradient(0,0,0,50);gg.addColorStop(0,'#ff6a2a');gg.addColorStop(1,'rgba(255,106,42,0)');ctx.fillStyle=gg;ctx.fillRect(0,0,W,50);ctx.restore()}
    ctx.restore()}
  for(const p of arena.pillars||[]){
    ctx.fillStyle='#0006';ctx.beginPath();ctx.ellipse(p.x+6,p.y+p.r*.8,p.r*.9,p.r*.3,0,0,Math.PI*2);ctx.fill();
    const pg=ctx.createRadialGradient(p.x-p.r*.3,p.y-p.r*.3,4,p.x,p.y,p.r);pg.addColorStop(0,'#5b6f9a');pg.addColorStop(1,'#26324f');
    ctx.fillStyle=pg;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#9fb6e8';ctx.lineWidth=4;ctx.stroke();
  }

    const h=(p.hitT||0)/.18, rr=p.r*(1+h*.15);
    ctx.save();ctx.shadowColor='#ff4df2';ctx.shadowBlur=20+h*30;
    ctx.fillStyle=h>0?'#ffd6fb':'#5a1a72';ctx.beginPath();ctx.arc(p.x,p.y,rr,0,Math.PI*2);ctx.fill();
    ctx.lineWidth=8;ctx.strokeStyle='#ff4df2';ctx.stroke();ctx.shadowBlur=0;
    ctx.fillStyle='#ff9cf7';ctx.beginPath();ctx.arc(p.x,p.y,rr*.35,0,Math.PI*2);ctx.fill();ctx.restore();
  }
  for(const p of arena.portals||[]){
    ctx.save();ctx.translate(p.x,p.y);
    for(let i=0;i<3;i++){ctx.rotate(time*(2+i));ctx.strokeStyle=p.c;ctx.globalAlpha=.9-i*.25;ctx.lineWidth=7;ctx.beginPath();ctx.arc(0,0,48-i*12,0,Math.PI*1.4);ctx.stroke()}
    ctx.globalAlpha=.5;ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(0,0,22,0,Math.PI*2);ctx.fill();ctx.restore();
  }
  const lo=inset();
  if(lo>0){ctx.fillStyle='rgba(60,8,12,.85)';ctx.fillRect(0,0,W,lo);ctx.fillRect(0,W-lo,W,lo);ctx.fillRect(0,lo,lo,W-2*lo);ctx.fillRect(W-lo,lo,lo,W-2*lo);
    ctx.save();ctx.strokeStyle='#ff5d5d';ctx.shadowColor='#ff5d5d';ctx.shadowBlur=20;ctx.lineWidth=8;ctx.strokeRect(lo,lo,W-2*lo,W-2*lo);ctx.restore()}
  const rim=sudden?`rgb(255,${60+Math.sin(time*8)*40},60)`:arena.rim;
  ctx.strokeStyle=rim;ctx.lineWidth=sudden?10:6;ctx.strokeRect(3,3,W-6,W-6);

const fog=document.createElement('canvas');fog.width=fog.height=250;const fctx=fog.getContext('2d');
function drawDark(){
  fctx.globalCompositeOperation='source-over';fctx.clearRect(0,0,250,250);fctx.fillStyle='rgba(3,5,12,.94)';fctx.fillRect(0,0,250,250);
  fctx.globalCompositeOperation='destination-out';
  const lights=balls.filter(b=>!b.dead).map(b=>({x:b.x,y:b.y,r:240}));
  for(const o of objs)if(o.layer===1&&o.x!==undefined)lights.push({x:o.x,y:o.y,r:70});
  for(const L of lights){const x=L.x/4,y=L.y/4,r=L.r/4,g=fctx.createRadialGradient(x,y,r*.3,x,y,r);g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(1,'rgba(0,0,0,0)');fctx.fillStyle=g;fctx.beginPath();fctx.arc(x,y,r,0,Math.PI*2);fctx.fill()}
  ctx.drawImage(fog,0,0,W,W);
}
function dashedArrow(b){
  const mine=b===balls[0];
  const a=Math.atan2(b.vy,b.vx),x0=b.x+Math.cos(a)*(b.r+20),y0=b.y+Math.sin(a)*(b.r+20),L=150;
  ctx.save();ctx.translate(x0,y0);ctx.rotate(a);ctx.fillStyle=mine?'#56f0ff':'#ffffff';ctx.globalAlpha=mine?.95:.35+Math.sin(time*6)*.15;
  if(mine){ctx.shadowColor='#56f0ff';ctx.shadowBlur=16}
  for(let i=0;i<4;i++)ctx.fillRect(i*30,-7,18,14);
  ctx.beginPath();ctx.moveTo(L+20,0);ctx.lineTo(L-15,-24);ctx.lineTo(L-15,24);ctx.closePath();ctx.fill();ctx.restore();
}
function drawFx(){
  for(const p of fx){
    const k=1-p.t/p.life;
    if(p.k==='s'){ctx.globalAlpha=k;ctx.fillStyle=p.c;ctx.fillRect(p.x-4,p.y-4,8,8)}
    else if(p.k==='r'){ctx.globalAlpha=k;ctx.strokeStyle=p.c;ctx.lineWidth=5;ctx.beginPath();ctx.arc(p.x,p.y,20+(1-k)*p.R,0,Math.PI*2);ctx.stroke()}
    else if(p.k==='boom'){ctx.globalAlpha=k*.8;const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.R);g.addColorStop(0,'#fff6c0');g.addColorStop(.5,'#ff9a1f');g.addColorStop(1,'rgba(255,60,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,p.R*(.6+.4*(1-k)),0,Math.PI*2);ctx.fill()}
    else if(p.k==='drop'){const q=p.t/p.life;ctx.globalAlpha=1;ctx.fillStyle='#ff2d4f';ctx.beginPath();ctx.arc(p.x+(p.tx-p.x)*q,p.y+(p.ty-p.y)*q,7*(1-q*.5),0,Math.PI*2);ctx.fill()}
    else if(p.k==='gold'){ctx.save();ctx.globalAlpha=k;ctx.strokeStyle='#ffc83d';ctx.shadowColor='#ffc83d';ctx.shadowBlur=30;ctx.lineWidth=14*k+2;ctx.beginPath();ctx.arc(p.x,p.y,40+(1-k)*p.R,0,Math.PI*2);ctx.stroke();
      ctx.globalAlpha=k*.25;ctx.fillStyle='#ffe08a';ctx.fill();ctx.restore()}
    else if(p.k==='q'){ctx.save();ctx.globalAlpha=Math.min(1,k*1.5);ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;ctx.shadowColor='#b05cff';ctx.shadowBlur=12;ctx.fillRect(-p.sz/2,-p.sz/2,p.sz,p.sz);ctx.restore()}
    else if(p.k==='conf'){ctx.save();ctx.globalAlpha=Math.min(1,k*2);ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;ctx.fillRect(-9,-5,18,10);ctx.restore()}
    else if(p.k==='cube'){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.t*3);const s=80+p.t*500;ctx.globalAlpha=k;ctx.strokeStyle='#d7a6ff';ctx.shadowColor='#a24bff';ctx.shadowBlur=30;ctx.lineWidth=10;ctx.strokeRect(-s/2,-s/2,s,s);ctx.rotate(.6);ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.strokeRect(-s/3,-s/3,s*.66,s*.66);ctx.restore()}
  }
  ctx.globalAlpha=1;ctx.textAlign='center';ctx.textBaseline='middle';
  for(const p of pops){
    const k=1-p.t/.9,sc=(p.t<.08?1.6-Math.max(0,p.t)*7:1)*(p.s||1);
    ctx.save();ctx.globalAlpha=Math.min(1,k*2);ctx.translate(p.x,p.y);ctx.scale(sc,sc);
    ctx.font=(p.big?54:44)+'px "Lilita One", "Arial Black", sans-serif';
    ctx.lineWidth=9;ctx.strokeStyle='#1a0003';ctx.strokeText(p.txt,0,0);ctx.fillStyle=p.c;ctx.fillText(p.txt,0,0);ctx.restore();
  }
}
function render(){
  ctx=mainCtx;
  ctx.setTransform(dpr*S,0,0,dpr*S,0,0);
  ctx.save();
  if(shake>.5)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  const tg=(state==='ko'&&koFocus)?{z:1.45,x:koFocus.x,y:koFocus.y}:{z:1,x:W/2,y:W/2},k=Math.min(1,lastDt*7);
  cam.z+=(tg.z-cam.z)*k;cam.x+=(tg.x-cam.x)*k;cam.y+=(tg.y-cam.y)*k;
  if(cam.z>1.002){const h=W/(2*cam.z),cx=clamp(cam.x,h,W-h),cy=clamp(cam.y,h,W-h);ctx.translate(W/2,W/2);ctx.scale(cam.z,cam.z);ctx.translate(-cx,-cy)}
  drawArena();
  for(const o of objs) if(o.layer===0) o.draw();
  for(const b of balls){const T=TYPES[b.type];if(T.under)T.under(b)}
  for(const b of balls) drawTrail(b);
  for(const b of balls) if(!b.dead) drawBall(b);
  for(const b of balls){const T=TYPES[b.type];if(T.over)T.over(b)}
  for(const o of objs) if(o.layer===1) o.draw();
  if(arena.dark&&state!=='over')drawDark();
  if(state==='ready') for(const b of balls) dashedArrow(b);
  drawFx();
  ctx.restore();
  if(flash>0){ctx.fillStyle=`rgba(255,255,255,${flash*.8})`;ctx.fillRect(0,0,W,W)}
}

function drawPreview(c,type,showExtras){
  const g=c.getContext('2d'),o=ctx;ctx=g;
  g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,c.width,c.height);
  const big=showExtras&&type==='sword',s=c.width/(big?380:(showExtras?190:160));
  g.setTransform(s,0,0,s,c.width/2-(big?c.width*.12:0),c.height/2+(type==='bomb'||type==='angel'?c.height*.07:0));
  const b={type,x:0,y:0,r:62,hp:100,max:100,flash:0,squash:0,slowT:0,ang:-.6+time*(showExtras?2:0),hooked:false,dead:false,ghost:0,dashT:0,boostT:0,psn:[],trail:[]};
  if(big)drawSword(b);
  drawBall(b,false);
  ctx=o;
}

const STAGE_NAMES=['Cuartos de final','Semifinal','Final contra jefes'];

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pickFoeTeam(){
  if(challenge)return challenge.team.map(t=>({ball:t.ball,lv:t.lv,boss:false}));
  let pool=ORDER.filter(k=>!save.team.includes(k));if(pool.length<3)pool=ORDER.slice();
  const lv=ladder?clamp(1+Math.floor((save.trophies||0)/450)-(Math.random()<.4?1:0),1,MAXLV):tour?clamp(Math.floor(save.wins/6)+tour.stage,1,MAXLV):clamp(1+Math.floor(save.wins/5)-(Math.random()<.4?1:0),1,MAXLV);
  const boss=!!(tour&&tour.stage===TOUR.stages);
  return shuffle(pool).slice(0,3).map(k=>({ball:k,lv:boss?Math.max(1,lv-2):lv,boss}));
}

  match={my:save.team.slice(),foe:pickFoeTeam(),wins:[0,0],round:0,used:[],ladder:ladder,online:false};

function startRound(myKey){
  match.used.push(myKey);
  const f=match.foe[match.round-1];
  for(const p of arena.bumpers||[])p.hitT=0;
  const a1=-Math.PI/3+(Math.random()-.5)*.8;
  balls=[mkBall(myKey,250,500,a1,lvOf(myKey)),mkBall(f.ball,f.boss?720:750,500,a1+Math.PI,f.lv)];

let last=performance.now(),acc=0;

  const dt=Math.min(.05,(t-last)/1000);last=t;lastDt=dt;
  if(state==='playing'||state==='ko')startMusic();else stopMusic();
  if(!$('fight').hidden){
    if(state==='playing'||state==='ko'){
      acc+=dt*(net?1:speed)*(state==='ko'?.3:1);
      while(acc>=STEP){step(STEP);acc-=STEP}
      netSmooth();
      if(state==='ko'&&koT>.55&&!net&&!(match&&match.online))endRound();
    } else time+=dt;
    updFx(dt*(state==='paused'?0:(state==='over'||state==='roundover'||state==='pick'||state==='search'||state==='netwait'?1:(net?1:speed)*(state==='ko'?.4:1))));
    if(net)netTick();

    time+=dt;
    if(!$('home').hidden)drawPreview(homeCv,save.sel,true);
  }
  requestAnimationFrame(frame);
}

function applySnap(st){

  for(let i=0;i<2;i++){const a=st.b[map[i]],b=balls[i];if(!Array.isArray(a)||!b)continue;

    if(N(9)&&!(b.supT>0))b.supT=.35;b.slowT=N(10)?.2:0;b.stunT=N(11)?.2:0;b.ghost=N(12)?.2:0;b.dashT=N(13)?.2:0;b.hooked=!!N(14);
    if(Math.hypot(b.tx-b.x,b.ty-b.y)>160){b.x=b.tx;b.y=b.ty}}
  if(Array.isArray(st.ev))for(const e of st.ev){if(!Array.isArray(e)||net.seen.has(e[0]))continue;net.seen.add(e[0]);
    const n=Math.floor(+e[3])||0,k=+e[4];

    if(k!==2){shake=Math.min(18,shake+(n>=5?10:3));beep(n>=5?140:280,n>=5?.14:.06,'square',.05,.5)}}
}
function netSmooth(){

}

let DB=null, USER=null, myId=null, players=[], canWrite=null, onlineState='loading', onTab='rank', writing=false, pendingPush=false, lastPushed='';
const cleanNick=v=>String(v||'').replace(/[\u0000-\u001f]/g,'').trim().slice(0,16);
function safePlayer(id,d){
  const n=x=>Number.isFinite(+x)?Math.max(0,Math.floor(+x)):0;
  const ball=TYPES[d.ball]?d.ball:'harpoon';
  let def=null;
  if(d.def&&typeof d.def==='object'){
    const map=ARENAS[d.def.map]?d.def.map:'clasica';
    let team=Array.isArray(d.def.team)?d.def.team.filter(t=>t&&TYPES[t.ball]).slice(0,3).map(t=>({ball:t.ball,lv:clamp(n(t.lv)||1,1,MAXLV)})):[];
    if(!team.length&&TYPES[d.def.ball])team=[{ball:d.def.ball,lv:clamp(n(d.def.lv)||1,1,MAXLV)}];
    while(team.length&&team.length<3)team.push(team[team.length-1]);
    if(team.length===3)def={team,map};
  }
  return {id,nick:cleanNick(d.nick),trophies:n(d.trophies),wins:n(d.wins),losses:n(d.losses),tours:n(d.tours),best:n(d.best),retos:n(d.retos),ball,lv:clamp(n(d.lv)||1,1,MAXLV),def};
}
async function initOnline(){
  try{if(window.claude&&typeof window.claude.use==='function')window.claude.use('room').then(r=>{ROOM=r||null}).catch(()=>{ROOM=null})}catch(e){}
  try{
    if(!window.claude||typeof window.claude.use!=='function'){onlineState='off';renderOnline();return}
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user){onlineState='off';renderOnline();return}
    DB=db;USER=user;myId=await user.id();
    if(!myId){onlineState='off';renderOnline();return}
    canWrite=await user.can('data.write');
    onlineState='on';
    if(!save.nick){const me=await user.me();save.nick=cleanNick((me.name||'').split(' ')[0]);persist()}
    db.collection('players').onSnapshot(snap=>{players=snap.docs.filter(d=>d.exists).map(d=>safePlayer(d.id,d.data()||{}));renderOnline()},
      ()=>{onlineState='off';renderOnline()});
    pushOnline();renderOnline();
  }catch(e){onlineState='off';renderOnline()}
}
function myDoc(){return {nick:cleanNick(save.nick),trophies:save.trophies||0,wins:save.wins,losses:save.losses,tours:save.tours||0,best:save.best||0,retos:save.retos||0,

async function pushOnline(){
  if(!DB||!myId||canWrite===false)return;
  const doc=myDoc(),key=JSON.stringify(doc);

  writing=true;
  try{await DB.doc('players/'+myId).set(Object.assign({upd:Date.now()},doc));lastPushed=key}
  catch(e){if(e&&e.code==='invalid_argument'){canWrite=false;renderOnline()}}

}

$('bUp').onclick=()=>{const k=save.sel,lv=lvOf(k);if(lv>=MAXLV)return;const c=upCost(k);
  if(save.coins<c){toast('Te faltan '+(c-save.coins)+' monedas');return}
  initAudio();save.coins-=c;save.lv[k]=lv+1;persist();setCoins(true);toast(TYPES[k].name+' sube a nivel '+(lv+1));
  beep(523,.1,'square',.06);setTimeout(()=>beep(784,.1,'square',.06),90);setTimeout(()=>beep(1046,.2,'square',.06),180);renderHome();pushOnline()};
window.addEventListener('resize',resize);
new ResizeObserver(resize).observe(stage);

migrateSave();persist();setCoins();show('home');requestAnimationFrame(frame);initOnline();
})();
</script>
</body>
